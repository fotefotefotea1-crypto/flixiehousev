<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flixie House - Admin Panel & Shop Settings (Cloud Synced)</title>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel CDN -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Prompt Font -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html { font-size: calc(16px * var(--flixie-font-scale, 1)); }
        @media (max-width: 767px) {
            [data-mobile-density="compact"] .rounded-xl, [data-mobile-density="compact"] .rounded-2xl { border-radius: 0.55rem; }
            [data-mobile-density="compact"] main { padding: 0.65rem !important; }
            [data-mobile-density="compact"] main .space-y-5 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.75rem; }
            [data-mobile-density="comfortable"] main { padding: 1rem !important; }
        }
        button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--flixie-accent, #e50914); outline-offset: 2px; }

        .flixie-readonly main button, .flixie-readonly main input, .flixie-readonly main select, .flixie-readonly main textarea { pointer-events:none !important; opacity:.55; }

        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Prompt', sans-serif;
            margin: 0; padding: 0;
            font-size: 15px;
            line-height: 1.55;
            -webkit-tap-highlight-color: transparent;
        }
        button, input, select, textarea { font: inherit; }
        button { min-height: 38px; touch-action: manipulation; }
        input, select, textarea { min-height: 42px; font-size: 14px !important; }
        input:focus, select:focus, textarea:focus, button:focus-visible {
            outline: 2px solid rgba(229,9,20,.65); outline-offset: 2px;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 7px; height: 7px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: inherit; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #555; border-radius: 8px; }
        table.fixed-table { table-layout: auto; width: 100%; min-width: 1180px; }
        main { min-width: 0; }
        .overflow-x-auto { -webkit-overflow-scrolling: touch; }
        @media (max-width: 767px) {
            body { font-size: 14px; }
            #root > div { min-height: 100dvh; height: 100dvh; }
            main { padding: 14px !important; gap: 16px !important; }
            header { min-height: 58px; height: auto !important; padding-top: 8px !important; padding-bottom: 8px !important; }
            aside { width: min(86vw, 310px) !important; padding: 16px !important; }
            .fixed-table { min-width: 760px !important; }
            main { overscroll-behavior: contain; }
            .overflow-x-auto { max-width: 100%; }
            @media (orientation: landscape) { #root > div { height: 100dvh; } aside { max-height: 100dvh; overflow-y: auto; } }
            .rounded-2xl.p-5, .rounded-2xl.p-6 { padding: 14px !important; }
            button { min-height: 42px; }
            .text-\[10px\] { font-size: 12px !important; }
            .text-\[11px\] { font-size: 12px !important; }
        }
        .text-\[9px\] { font-size: 11px !important; }
        .text-\[10px\] { font-size: 12px !important; }
        .text-\[11px\] { font-size: 12px !important; }
        .text-xs { font-size: 13px; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Supabase Client Setup
        const SUPABASE_URL = "https://alpfpeazatklhnlghvph.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_cBOskPP5NVyI9QTAzkPpgg_fKUl5lFd";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function App() {
            // Login removed by request. The app opens directly in local mode.
            const [authSession, setAuthSession] = useState(null);
            const [authUser, setAuthUser] = useState(null);
            const [userRole, setUserRole] = useState({ role: 'owner', active: true });
            const [authLoading, setAuthLoading] = useState(false);
            const [loginEmail, setLoginEmail] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            const [adminPin, setAdminPin] = useState('');
            const [adminToken, setAdminToken] = useState(() => sessionStorage.getItem('flixie_admin_token') || '');
            const [pinBusy, setPinBusy] = useState(false);
            const [pinError, setPinError] = useState('');
            const [cloudReady, setCloudReady] = useState(false);
            const [auditRows, setAuditRows] = useState([]);
            const [auditOpen, setAuditOpen] = useState(false);
            const [roleOpen, setRoleOpen] = useState(false);
            const [roleRows, setRoleRows] = useState([]);
            const [newRoleUserId, setNewRoleUserId] = useState('');
            const [newRoleValue, setNewRoleValue] = useState('viewer');
            const canEdit = true;
            const isAdmin = false;

            // Authentication and role checks are disabled; no login screen is shown.

            // Role management and database audit tables are intentionally unavailable in PIN mode.
            const loadRoleRows = async () => { alert('โหมด PIN ไม่รองรับการจัดการผู้ใช้ Supabase'); };
            const saveRole = async () => { alert('โหมด PIN ไม่รองรับการจัดการผู้ใช้ Supabase'); };
            const toggleRoleActive = async () => {};
            const loadAuditRows = async () => { alert('ประวัติการแก้ไขแบบฐานข้อมูลยังไม่ได้เปิดใช้ในโหมด PIN'); };

            const [activeTab, setActiveTab] = useState(() => {
                return localStorage.getItem('flixie_active_tab_v76') || 'dashboard';
            });

            useEffect(() => {
                localStorage.setItem('flixie_active_tab_v76', activeTab);
            }, [activeTab]);

            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            // Advanced appearance and notification preferences (saved per device)
            const [accentColor, setAccentColor] = useState(() => localStorage.getItem('flixie_accent_color') || '#e50914');
            const [fontScale, setFontScale] = useState(() => Number(localStorage.getItem('flixie_font_scale') || 100));
            const [notificationSound, setNotificationSound] = useState(() => localStorage.getItem('flixie_notification_sound') !== 'false');
            const [mobileDensity, setMobileDensity] = useState(() => localStorage.getItem('flixie_mobile_density') || 'comfortable');
            const [smartSearch, setSmartSearch] = useState('');
            const [smartSearchOpen, setSmartSearchOpen] = useState(false);

            useEffect(() => {
                localStorage.setItem('flixie_accent_color', accentColor);
                document.documentElement.style.setProperty('--flixie-accent', accentColor);
            }, [accentColor]);
            useEffect(() => {
                localStorage.setItem('flixie_font_scale', String(fontScale));
                document.documentElement.style.setProperty('--flixie-font-scale', String(fontScale / 100));
            }, [fontScale]);
            useEffect(() => {
                localStorage.setItem('flixie_notification_sound', String(notificationSound));
            }, [notificationSound]);
            useEffect(() => {
                localStorage.setItem('flixie_mobile_density', mobileDensity);
                document.documentElement.dataset.mobileDensity = mobileDensity;
            }, [mobileDensity]);

            const playNotificationTest = () => {
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!AudioCtx) return alert('เบราว์เซอร์นี้ไม่รองรับเสียงแจ้งเตือน');
                    const ctx = new AudioCtx();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.frequency.value = 880; gain.gain.setValueAtTime(0.0001, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.03);
                    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
                    osc.start(); osc.stop(ctx.currentTime + 0.36);
                    osc.onended = () => ctx.close();
                } catch (e) { alert('ไม่สามารถเล่นเสียงได้ในขณะนี้'); }
            };




            // Theme State
            const [themeMode, setThemeMode] = useState(() => {
                return localStorage.getItem('flixie_theme_mode') || 'dark';
            });

            useEffect(() => {
                localStorage.setItem('flixie_theme_mode', themeMode);
            }, [themeMode]);

            const isLight = themeMode === 'light';
            const bgMain = isLight ? '#f4f5f7' : '#0d0d0d';
            const bgSidebar = isLight ? '#ffffff' : '#141414';
            const bgCard = isLight ? '#ffffff' : '#141414';
            const borderCol = isLight ? '#e2e8f0' : '#222222';
            const textMain = isLight ? '#1e293b' : '#ffffff';
            const textSub = isLight ? '#64748b' : '#9ca3af';

            // Cloud Save Status Indicator State
            const [saveStatus, setSaveStatus] = useState('กำลังเชื่อมต่อ Cloud...');
            const [isDataLoaded, setIsDataLoaded] = useState(false);

            // Notification Permission State
            const [notifPermission, setNotifPermission] = useState(() => {
                if (typeof window !== 'undefined' && 'Notification' in window) {
                    return Notification.permission;
                }
                return 'default';
            });

            const requestNotificationPermission = async () => {
                if ('Notification' in window) {
                    const permission = await Notification.requestPermission();
                    setNotifPermission(permission);
                    if (permission === 'granted') {
                        alert('เปิดสิทธิ์ Notification สำเร็จ ระบบจะแจ้งเตือนเมื่อมีจอหมดอายุ');
                        new Notification('Flixie House Admin', { body: 'ระบบแจ้งเตือนทำงานเรียบร้อยแล้ว!' });
                    } else {
                        alert('คุณปฏิเสธการอนุญาตการแจ้งเตือน');
                    }
                } else {
                    alert('เบราว์เซอร์นี้ไม่รองรับ Desktop Notification');
                }
            };

            // Toast Notification
            const [toastMessage, setToastMessage] = useState(null);

            const showToast = (text) => {
                setToastMessage(text);
                setTimeout(() => {
                    setToastMessage(null);
                }, 2000);
            };

            const handleCopyText = (text, label) => {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast(`คัดลอก ${label}: ${text} สำเร็จ!`);
                    }).catch(err => {
                        fallbackCopyText(text, label);
                    });
                } else {
                    fallbackCopyText(text, label);
                }
            };

            const fallbackCopyText = (text, label) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        showToast(`คัดลอก ${label}: ${text} สำเร็จ!`);
                    }
                } catch (err) {}
                document.body.removeChild(textArea);
            };

            // Search Query States
            const [searchQueryProfiles, setSearchQueryProfiles] = useState('');
            const [searchQueryReviews, setSearchQueryReviews] = useState('');
            const [searchQueryHistory, setSearchQueryHistory] = useState('');
            const [searchQueryRevenue, setSearchQueryRevenue] = useState('');
            const [searchQueryBackend, setSearchQueryBackend] = useState('');
            const [searchQueryManage, setSearchQueryManage] = useState('');

            // Modals State
            const [isNotifModalOpen, setIsNotifModalOpen] = useState(false);
            const [isEditReviewOpen, setIsEditReviewOpen] = useState(false);
            const [editingReview, setEditingReview] = useState(null);

            // Form เพิ่มรีวิว State
            const [newRevCustomer, setNewRevCustomer] = useState('');
            const [newRevPlatform, setNewRevPlatform] = useState('LINE');
            const [newRevRating, setNewRevRating] = useState(10);
            const [newRevComment, setNewRevComment] = useState('');

            // Data States
            const [reviews, setReviews] = useState([]);
            const [shopSettings, setShopSettings] = useState({
                shopName: '',
                lineLink: '',
                facebookLink: '',
                description: '',
                mobilePackages: [],
                tvPackages: []
            });
            const [accounts, setAccounts] = useState([]);
            const [backendItems, setBackendItems] = useState([]); // แยกข้อมูลสำหรับหน้า "ข้อมูลหลังบ้าน" อิสระ
            const [sales, setSales] = useState([]);
            const [activities, setActivities] = useState([]);
            const [operatorName, setOperatorName] = useState(() => localStorage.getItem('flixie_operator_name') || 'ผู้ใช้งาน');
            const [crmQuery, setCrmQuery] = useState('');

            const smartSearchResults = (() => {
                const q = smartSearch.trim().toLowerCase();
                if (!q) return [];
                const sources = [
                    { rows: accounts, tab: 'profiles', label: 'บัญชีและโปรไฟล์' },
                    { rows: sales, tab: 'purchase_history', label: 'ประวัติการซื้อ' },
                    { rows: reviews, tab: 'reviews', label: 'รีวิวลูกค้า' },
                    { rows: backendItems, tab: 'backend_info', label: 'ข้อมูลหลังบ้าน' }
                ];
                const found = [];
                sources.forEach(source => (source.rows || []).forEach((row, index) => {
                    let raw = '';
                    try { raw = JSON.stringify(row); } catch (e) {}
                    if (raw.toLowerCase().includes(q)) {
                        const title = row.customerName || row.customer || row.name || row.email || row.accountEmail || row.netflixEmail || row.title || `${source.label} #${index + 1}`;
                        found.push({ title: String(title), detail: source.label, tab: source.tab, key: `${source.tab}-${row.id || index}` });
                    }
                }));
                return found.slice(0, 12);
            })();
            const [selectedCrmCustomer, setSelectedCrmCustomer] = useState('');

            // Form สำหรับเพิ่มแถวใหม่ในหน้า "จัดการบัญชี" (2 ช่อง)
            const [manageEmail, setManageEmail] = useState('');
            const [manageLink, setManageLink] = useState('');

            // Form สำหรับเพิ่มแถวใหม่ในหน้า "ข้อมูลหลังบ้าน" (3 ช่อง)
            const [backendNetEmail, setBackendNetEmail] = useState('');
            const [backendGmailPass, setBackendGmailPass] = useState('');
            const [backendNetPass, setBackendNetPass] = useState('');

            // PIN-gated Cloud API. The browser never reads/writes the protected table directly.
            const callAdminApi = async (body) => {
                const { data, error } = await supabaseClient.functions.invoke('flixie-admin', { body });
                if (error) throw error;
                if (!data || data.ok !== true) throw new Error((data && data.error) || 'คำขอไม่สำเร็จ');
                return data;
            };
            const unlockAdmin = async () => {
                if (!adminPin.trim()) { setPinError('กรุณากรอกรหัส PIN'); return; }
                setPinBusy(true); setPinError('');
                try {
                    const result = await callAdminApi({ action: 'unlock', pin: adminPin });
                    sessionStorage.setItem('flixie_admin_token', result.token);
                    setAdminToken(result.token); setAdminPin('');
                } catch (err) { setPinError('PIN ไม่ถูกต้อง หรือระบบยังตั้งค่าไม่ครบ'); }
                finally { setPinBusy(false); }
            };
            const lockAdmin = () => {
                sessionStorage.removeItem('flixie_admin_token');
                setAdminToken(''); setCloudReady(false); setIsDataLoaded(false);
            };
            const applyCloudStore = (store) => {
                if (!store) return;
                if (store.shopSettings) setShopSettings(store.shopSettings);
                if (store.accounts) setAccounts(store.accounts);
                if (store.backendItems) setBackendItems(store.backendItems);
                if (store.sales) setSales(store.sales);
                if (store.reviews) setReviews(store.reviews);
                if (store.activities) setActivities(store.activities);
                latestStoreDataRef.current = {
                    shopSettings: store.shopSettings || {}, accounts: store.accounts || [],
                    backendItems: store.backendItems || [], sales: store.sales || [],
                    reviews: store.reviews || [], activities: store.activities || []
                };
            };
            useEffect(() => {
                if (!adminToken) return;
                let alive = true;
                const pull = async () => {
                    try {
                        const result = await callAdminApi({ action: 'get', token: adminToken });
                        if (!alive) return;
                        applyCloudStore(result.data || {});
                        setSaveStatus('เชื่อมต่อ Cloud แล้ว'); setCloudReady(true); setIsDataLoaded(true);
                    } catch (err) {
                        if (!alive) return;
                        console.error('Cloud fetch error:', err);
                        if (err?.context?.status === 401 || /token|unauthorized|expired/i.test(String(err.message))) lockAdmin();
                        else setSaveStatus('เชื่อมต่อ Cloud ไม่สำเร็จ');
                    }
                };
                pull();
                const timer = setInterval(pull, 10000);
                return () => { alive = false; clearInterval(timer); };
            }, [adminToken]);

            // Keep a current snapshot so rapid edits do not overwrite unrelated newer data.
            const latestStoreDataRef = useRef({ shopSettings, accounts, backendItems, sales, reviews, activities });
            const cloudWriteQueueRef = useRef(Promise.resolve());
            useEffect(() => {
                latestStoreDataRef.current = { shopSettings, accounts, backendItems, sales, reviews, activities };
            }, [shopSettings, accounts, backendItems, sales, reviews, activities]);

            // 2. Save to Supabase function
            const saveToCloud = async (overrideData) => {
                if (!isDataLoaded || !canEdit || !adminToken) return;
                setSaveStatus('กำลังซิงค์ไป Cloud...');
                const currentStoreData = { ...latestStoreDataRef.current, ...(overrideData || {}) };
                latestStoreDataRef.current = currentStoreData;
                const writeTask = cloudWriteQueueRef.current.then(async () => {
                    await callAdminApi({ action: 'save', token: adminToken, data: currentStoreData });
                });
                cloudWriteQueueRef.current = writeTask.catch(() => {});
                try { await writeTask; setSaveStatus('ซิงค์ Cloud เรียบร้อย'); }
                catch (err) { console.error('Cloud save error:', err); setSaveStatus('เกิดข้อผิดพลาดในการซิงค์ Cloud'); }
            };

            const safeAuditSnapshot = (value) => {
                const clean = (v) => {
                    if (Array.isArray(v)) return v.map(clean);
                    if (v && typeof v === 'object') {
                        const out = {};
                        Object.keys(v).forEach(k => {
                            if (/pin|password|pass|token|secret/i.test(k)) return;
                            out[k] = clean(v[k]);
                        });
                        return out;
                    }
                    return v;
                };
                try { return JSON.stringify(clean(value)).slice(0, 1200); } catch (e) { return ''; }
            };
            const recordLocalAudit = (stateType, before, after) => {
                if (stateType === 'activities') return;
                const actionMap = { accounts: 'ข้อมูลบัญชี/โปรไฟล์/ลูกค้า', sales: 'ประวัติการซื้อ', reviews: 'รีวิว', backendItems: 'ข้อมูลหลังบ้าน', shopSettings: 'การตั้งค่า' };
                const beforeCount = Array.isArray(before) ? before.length : (before && typeof before === 'object' ? Object.keys(before).length : 0);
                const afterCount = Array.isArray(after) ? after.length : (after && typeof after === 'object' ? Object.keys(after).length : 0);
                const verb = Array.isArray(before) && Array.isArray(after) ? (after.length > before.length ? 'เพิ่ม' : after.length < before.length ? 'ลบ' : 'แก้ไข') : 'แก้ไข';
                const entry = {
                    id: `audit-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,
                    type: 'audit', action: `${verb}${actionMap[stateType] || 'ข้อมูล'}`, 
                    operator: operatorName || 'ผู้ใช้งาน', device: navigator.userAgent.slice(0,100),
                    at: new Date().toISOString(), entity: stateType,
                    before: safeAuditSnapshot(before), after: safeAuditSnapshot(after),
                    summary: `จำนวนรายการ ${beforeCount} → ${afterCount}`
                };
                setActivities(prev => {
                    const next = [entry, ...(prev || [])].slice(0, 200);
                    saveToCloud({ activities: next });
                    return next;
                });
            };

            const updateStateAndSync = (updater, stateType) => {
                if (stateType === 'shopSettings') {
                    setShopSettings(prev => {
                        const next = typeof updater === 'function' ? updater(prev) : updater;
                        recordLocalAudit('shopSettings', prev, next);
                        saveToCloud({ shopSettings: next });
                        return next;
                    });
                } else if (stateType === 'accounts') {
                    setAccounts(prev => {
                        const next = typeof updater === 'function' ? updater(prev) : updater;
                        recordLocalAudit('accounts', prev, next);
                        saveToCloud({ accounts: next });
                        return next;
                    });
                } else if (stateType === 'backendItems') {
                    setBackendItems(prev => {
                        const next = typeof updater === 'function' ? updater(prev) : updater;
                        recordLocalAudit('backendItems', prev, next);
                        saveToCloud({ backendItems: next });
                        return next;
                    });
                } else if (stateType === 'sales') {
                    setSales(prev => {
                        const next = typeof updater === 'function' ? updater(prev) : updater;
                        recordLocalAudit('sales', prev, next);
                        saveToCloud({ sales: next });
                        return next;
                    });
                } else if (stateType === 'reviews') {
                    setReviews(prev => {
                        const next = typeof updater === 'function' ? updater(prev) : updater;
                        recordLocalAudit('reviews', prev, next);
                        saveToCloud({ reviews: next });
                        return next;
                    });
                } else if (stateType === 'activities') {
                    setActivities(prev => {
                        const next = typeof updater === 'function' ? updater(prev) : updater;
                        saveToCloud({ activities: next });
                        return next;
                    });
                }
            };

            // Start a clean store: clears operational records in the shared Cloud database.
            const resetAllDataToZero = async () => {
                const confirmed = window.confirm('ยืนยันล้างข้อมูลร้านค้าทั้งหมดหรือไม่? บัญชี โปรไฟล์ ลูกค้า ประวัติขาย รีวิว และข้อมูลหลังบ้านจะถูกลบจาก Cloud ทุกอุปกรณ์ การกระทำนี้ย้อนกลับไม่ได้ กรุณาดาวน์โหลดไฟล์สำรองก่อน');
                if (!confirmed) return;
                const emptyStore = {
                    shopSettings: {
                        shopName: '',
                        lineLink: '',
                        facebookLink: '',
                        description: '',
                        mobilePackages: [],
                        tvPackages: []
                    },
                    accounts: [], backendItems: [], sales: [], reviews: [], activities: []
                };
                setSaveStatus('กำลังล้างข้อมูลและเริ่มต้นใหม่...');
                try {
                    // Wait for earlier edits to finish so an older queued save cannot restore old data.
                    await cloudWriteQueueRef.current;
                    await callAdminApi({ action: 'save', token: adminToken, data: emptyStore });
                    setShopSettings(emptyStore.shopSettings);
                    setAccounts([]);
                    setBackendItems([]);
                    setSales([]);
                    setReviews([]);

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15);

                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.8);

                const sevenDaysAgo = now.getTime() - (7 * 24 * 60 * 60 * 1000);
                const thirtyDaysAgo = now.getTime() - (30 * 24 * 60 * 60 * 1000);

                let todayRev = 0;
                let sevenDaysRev = 0;
                let thirtyDaysRev = 0;
                let totalRev = 0;

                sales.forEach(s => {
                    const amt = parseFloat(s.amount) || 0;
                    totalRev += amt;

                    let saleTime = s.rawDate ? new Date(s.rawDate).getTime() : null;
                    if (!saleTime && s.dateStr) {

                    if (saleTime) {

                                            <h2 className="font-bold text-sm" style={{ color: textMain }}>ข้อมูลหลังบ้าน (อีเมล Netflix, รหัส Gmail, รหัส Netflix)</h2>
                                            <p className="text-[10px] text-gray-400 mt-0.5">จัดการข้อมูลในหน้านี้โดยเฉพาะ (ไม่กระทบหน้าจัดการบัญชี)</p>
                                        </div>
                                        
                                        <div className="flex items-center gap-2">
                                            <button onClick={() => {
                                                const fullData = { shopSettings, accounts, backendItems, sales, reviews, activities };
                                                handleCopyText(JSON.stringify(fullData, null, 2), 'Raw JSON Data');
                                            }} className="bg-[#222] border border-[#333] hover:bg-[#282828] text-white px-3.5 py-2 rounded-xl text-xs font-semibold shadow flex items-center gap-1.5">
                                                <span>📋</span> คัดลอก JSON
                                            </button>
                                        </div>
                                    </div>

                                    {/* ฟอร์มเพิ่มบัญชีใหม่ 3 ช่อง */}
                                    <div className="border rounded-2xl p-5 shadow-xl space-y-4" style={{ backgroundColor: bgCard, borderColor: borderCol }}>
                                        <h3 className="font-bold text-xs text-emerald-400">➕ เพิ่มข้อมูลหลังบ้านใหม่</h3>
                                        <form onSubmit={handleAddBackendItem} className="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
                                            <div>
                                                <label className="block text-[10px] mb-1 text-gray-400">อีเมล Netflix</label>
                                                <input 
                                                    type="email" 
                                                    value={backendNetEmail} 
                                                    onChange={e => setBackendNetEmail(e.target.value)} 
                                                    placeholder="example@hotmail.com" 
                                                    className="w-full border rounded-xl px-3 py-2 text-xs outline-none focus:border-emerald-500 font-mono" 
                                                    style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }} 
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-[10px] mb-1 text-gray-400">รหัส Gmail (รหัสอีเมลสำรอง)</label>
                                                <input 
                                                    type="text" 
                                                    value={backendGmailPass} 
                                                    onChange={e => setBackendGmailPass(e.target.value)} 
                                                    placeholder="รหัส Gmail / เมลสำรอง" 
                                                    className="w-full border rounded-xl px-3 py-2 text-xs outline-none focus:border-emerald-500 font-mono" 
                                                    style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }} 
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-[10px] mb-1 text-gray-400">รหัส Netflix</label>
                                                <input 
                                                    type="text" 
                                                    value={backendNetPass} 
                                                    onChange={e => setBackendNetPass(e.target.value)} 
                                                    placeholder="รหัสผ่าน Netflix" 
                                                    className="w-full border rounded-xl px-3 py-2 text-xs outline-none focus:border-emerald-500 font-mono" 
                                                    style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }} 
                                                />
                                            </div>
                                            <div>
                                                <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-xl text-xs font-bold shadow transition">
                                                    + บันทึกเพิ่มข้อมูล
                                                </button>
                                            </div>
                                        </form>
                                    </div>

                                    {/* ตารางแสดงผลหน้า ข้อมูลหลังบ้าน */}
                                    <div className="border rounded-2xl overflow-hidden shadow-xl transition" style={{ backgroundColor: bgCard, borderColor: borderCol }}>
                                        <div className="p-3 border-b flex justify-between items-center" style={{ borderColor: borderCol, backgroundColor: isLight ? '#f8fafc' : '#121212' }}>
                                            <span className="font-bold text-xs" style={{ color: textMain }}>รายการทั้งหมด ({backendItems.length})</span>
                                            <div className="relative w-64">
                                                <input 
                                                    type="text" 
                                                    value={searchQueryBackend} 
                                                    onChange={e => setSearchQueryBackend(e.target.value)} 
                                                    placeholder="ค้นหาข้อมูลหลังบ้าน..." 
                                                    className="w-full border rounded-lg px-3 py-1 text-xs outline-none focus:border-emerald-500"
                                                    style={{ backgroundColor: isLight ? '#ffffff' : '#181818', borderColor: borderCol, color: textMain }}
                                                />
                                            </div>
                                        </div>

                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left text-xs border-collapse">
                                                <thead>
                                                    <tr className="border-b text-[10px] uppercase font-semibold transition" style={{ borderColor: borderCol, color: textSub, backgroundColor: isLight ? '#e2e8f0' : '#1a1a1a' }}>
                                                        <th className="py-3 px-4 w-12 text-center">#</th>
                                                        <th className="py-3 px-4">อีเมล Netflix</th>
                                                        <th className="py-3 px-4">รหัส Gmail (รหัสอีเมลสำรอง)</th>
                                                        <th className="py-3 px-4">รหัส Netflix</th>
                                                        <th className="py-3 px-4 text-right w-24">จัดการ</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y font-medium" style={{ borderColor: borderCol }}>
                                                    {filteredBackendItems.length === 0 ? (
                                                        <tr>
                                                            <td colSpan="5" className="py-12 text-center text-gray-400">ยังไม่มีข้อมูลในระบบหลังบ้าน</td>
                                                        </tr>
                                                    ) : (
                                                        filteredBackendItems.map((item, index) => (
                                                            <tr key={item.id} className="transition hover:bg-white/5">
                                                                <td className="py-3 px-4 text-center text-gray-400 font-mono">{index + 1}</td>
                                                                <td className="py-3 px-4 font-mono font-bold">
                                                                    <div className="flex items-center gap-2">
                                                                        <input 
                                                                            type="text" 
                                                                            value={item.email} 
                                                                            onChange={e => handleUpdateBackendItemField(item.id, 'email', e.target.value)} 
                                                                            className="w-full bg-transparent border border-transparent hover:border-gray-500 focus:border-emerald-500 rounded px-2 py-1 outline-none font-mono text-xs transition"
                                                                            style={{ color: textMain }}
                                                                        />
                                                                        <button onClick={() => handleCopyText(item.email, 'อีเมล Netflix')} className="text-gray-400 hover:text-white text-xs">📋</button>
                                                                    </div>
                                                                </td>
                                                                <td className="py-3 px-4 font-mono">
                                                                    <div className="flex items-center gap-2">
                                                                        <input 
                                                                            type="text" 
                                                                            value={item.gmailPass || ''} 
                                                                            onChange={e => handleUpdateBackendItemField(item.id, 'gmailPass', e.target.value)} 
                                                                            placeholder="รหัส Gmail / เมลสำรอง" 
                                                                            className="w-full bg-transparent border border-transparent hover:border-gray-500 focus:border-emerald-500 rounded px-2 py-1 outline-none font-mono text-xs transition text-amber-400"
                                                                        />
                                                                        <button onClick={() => handleCopyText(item.gmailPass || '', 'รหัส Gmail')} className="text-gray-400 hover:text-white text-xs">📋</button>
                                                                    </div>
                                                                </td>
                                                                <td className="py-3 px-4 font-mono">
                                                                    <div className="flex items-center gap-2">
                                                                        <input 
                                                                            type="text" 
                                                                            value={item.netPass} 
                                                                            onChange={e => handleUpdateBackendItemField(item.id, 'netPass', e.target.value)} 
                                                                            className="w-full bg-transparent border border-transparent hover:border-gray-500 focus:border-emerald-500 rounded px-2 py-1 outline-none font-mono text-xs transition text-emerald-400 font-bold"
                                                                        />
                                                                        <button onClick={() => handleCopyText(item.netPass, 'รหัส Netflix')} className="text-gray-400 hover:text-white text-xs">📋</button>
                                                                    </div>
                                                                </td>
                                                                <td className="py-3 px-4 text-right">
                                                                    <button 
                                                                        onClick={() => handleDeleteBackendItem(item.id)} 
                                                                        className="bg-red-950/40 border border-red-900/60 hover:bg-red-900/60 text-red-400 px-3 py-1 rounded text-[11px] font-semibold transition"
                                                                    >
                                                                        ลบ
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        ))
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </main>
                    </div>

                    {isEditReviewOpen && editingReview && (
                        <div className="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="border rounded-2xl w-full max-w-md shadow-2xl p-6 space-y-4" style={{ backgroundColor: bgCard, borderColor: borderCol }}>
                                <div className="flex justify-between items-center border-b pb-3" style={{ borderColor: borderCol }}>
                                    <h3 className="font-bold text-sm" style={{ color: textMain }}>แก้ไขรีวิว</h3>
                                    <button onClick={() => setIsEditReviewOpen(false)} className="text-gray-400 hover:text-white">✕</button>
                                </div>
                                <form onSubmit={handleUpdateReview} className="space-y-3">
                                    <input type="text" value={editingReview.customer} onChange={e => setEditingReview({...editingReview, customer: e.target.value})} className="w-full border rounded-xl px-3.5 py-2 text-xs" style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }} />
                                    <textarea rows="3" value={editingReview.comment} onChange={e => setEditingReview({...editingReview, comment: e.target.value})} className="w-full border rounded-xl px-3.5 py-2 text-xs" style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }} />
                                    <div className="flex justify-end gap-2 pt-2">
                                        <button type="button" onClick={() => setIsEditReviewOpen(false)} className="border px-4 py-2 rounded-xl text-xs" style={{ borderColor: borderCol, color: textMain }}>ยกเลิก</button>
                                        <button type="submit" className="bg-[var(--flixie-accent)] text-white px-5 py-2 rounded-xl text-xs font-semibold">บันทึก</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {isNotifModalOpen && (
                        <div className="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="border rounded-2xl w-full max-w-lg shadow-2xl p-6 space-y-4" style={{ backgroundColor: bgCard, borderColor: borderCol }}>
                                <div className="flex justify-between items-center border-b pb-3" style={{ borderColor: borderCol }}>
                                    <h3 className="font-bold text-sm" style={{ color: textMain }}>รายการจอที่หมดเวลาแล้ว</h3>
                                    <button onClick={() => setIsNotifModalOpen(false)} className="text-gray-400 hover:text-white">✕</button>
                                </div>
                                <div className="max-h-80 overflow-y-auto space-y-2">
                                    {expiredList.length === 0 ? <p className="text-xs text-emerald-400 text-center py-6">ไม่มีจอหมดเวลา</p> : (
                                        expiredList.map((item, idx) => (
                                            <div key={idx} className="flex justify-between items-center p-3 border rounded-xl" style={{ borderColor: borderCol, backgroundColor: isLight ? '#f8fafc' : '#1a1a1a' }}>
                                                <div>
                                                    <p className="font-bold text-xs" style={{ color: textMain }}>{item.userLabel} (ลูกค้า: {item.customer})</p>
                                                    <p className="text-[10px] text-amber-400">หมดอายุ: {item.end}</p>
                                                </div>
                                                <button onClick={() => { handleReturnProfile(item.accId, item.id, item.userLabel); setIsNotifModalOpen(false); }} className="bg-amber-600 text-white px-3 py-1 rounded text-xs font-bold">คืนจอ</button>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {isAddModalOpen && (
                        <div className="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="border rounded-2xl w-full max-w-md shadow-2xl p-6 space-y-4" style={{ backgroundColor: bgCard, borderColor: borderCol }}>
                                <h3 className="font-bold text-sm" style={{ color: textMain }}>เพิ่มบัญชี Netflix ใหม่</h3>
                                <form onSubmit={handleCreateAccount} className="space-y-3">
                                    <input type="text" value={formName} onChange={e => setFormName(e.target.value)} placeholder="ชื่อบัญชี (เช่น Netflix Hub)" className="w-full border rounded-xl px-3.5 py-2 text-xs" style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }} />
                                    <input type="email" value={formEmail} onChange={e => setFormEmail(e.target.value)} required placeholder="อีเมล Netflix" className="w-full border rounded-xl px-3.5 py-2 text-xs" style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }} />
                                    <input type="text" value={formPassword} onChange={e => setFormPassword(e.target.value)} required placeholder="รหัสผ่าน" className="w-full border rounded-xl px-3.5 py-2 text-xs" style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }} />
                                    <input type="number" value={formProfilesCount} onChange={e => setFormProfilesCount(e.target.value)} min="1" max="10" className="w-full border rounded-xl px-3.5 py-2 text-xs" style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }} />
                                    <div className="flex justify-end gap-2 pt-2">
                                        <button type="button" onClick={() => setIsAddModalOpen(false)} className="border px-4 py-2 rounded-xl text-xs" style={{ borderColor: borderCol, color: textMain }}>ยกเลิก</button>
                                        <button type="submit" className="bg-[var(--flixie-accent)] text-white px-5 py-2 rounded-xl text-xs font-semibold">เพิ่มบัญชี</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {isEditModalOpen && editingAccount && (
                        <div className="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="border rounded-2xl w-full max-w-md shadow-2xl p-6 space-y-4" style={{ backgroundColor: bgCard, borderColor: borderCol }}>
                                <h3 className="font-bold text-sm" style={{ color: textMain }}>แก้ไขบัญชี Netflix</h3>
                                <form onSubmit={handleUpdateAccount} className="space-y-3">
                                    <input type="text" value={editingAccount.name} onChange={e => setEditingAccount({...editingAccount, name: e.target.value})} className="w-full border rounded-xl px-3.5 py-2 text-xs" style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }} />
                                    <input type="email" value={editingAccount.email} onChange={e => setEditingAccount({...editingAccount, email: e.target.value})} required className="w-full border rounded-xl px-3.5 py-2 text-xs" style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }} />
                                    <input type="text" value={editingAccount.password} onChange={e => setEditingAccount({...editingAccount, password: e.target.value})} required className="w-full border rounded-xl px-3.5 py-2 text-xs" style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }} />
                                    <div className="flex justify-end gap-2 pt-2">
                                        <button type="button" onClick={() => setIsEditModalOpen(false)} className="border px-4 py-2 rounded-xl text-xs" style={{ borderColor: borderCol, color: textMain }}>ยกเลิก</button>
                                        <button type="submit" className="bg-[var(--flixie-accent)] text-white px-5 py-2 rounded-xl text-xs font-semibold">บันทึก</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: เพิ่มลูกค้าเข้าโปรไฟล์ */}
                    {isAddCustomerOpen && (
                        <div className="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="border rounded-2xl w-full max-w-lg shadow-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar" style={{ backgroundColor: bgCard, borderColor: borderCol }}>
                                <div className="flex justify-between items-center border-b pb-3" style={{ borderColor: borderCol }}>
                                    <div>
                                        <h3 className="font-bold text-sm text-white">เพิ่มลูกค้าเข้าโปรไฟล์</h3>
                                        <p className="text-[10px] text-emerald-400 mt-0.5">กำลังเพิ่มเข้า {selectedProfileForCustomer?.userLabel}</p>
                                    </div>
                                    <button onClick={() => setIsAddCustomerOpen(false)} className="text-gray-400 hover:text-white text-sm">✕</button>
                                </div>
                                <form onSubmit={handleSaveCustomer} className="space-y-4">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-[11px] mb-1.5 text-gray-400">ชื่อลูกค้า</label>
                                            <input 
                                                type="text" 
                                                value={custName} 
                                                onChange={e => setCustName(e.target.value)} 
                                                required 
                                                placeholder="ชื่อลูกค้า" 
                                                className="w-full border rounded-xl px-3.5 py-2.5 text-xs outline-none focus:border-[var(--flixie-accent)]" 
                                                style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }} 
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] mb-1.5 text-gray-400">ช่องทางติดต่อ</label>
                                            <select 
                                                value={custContact} 
                                                onChange={e => setCustContact(e.target.value)} 
                                                className="w-full border rounded-xl px-3.5 py-2.5 text-xs outline-none focus:border-[var(--flixie-accent)]" 
                                                style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }}
                                            >
                                                <option value="LINE">LINE</option>
                                                <option value="Facebook">Facebook</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-[11px] mb-1.5 text-gray-400">วันที่เริ่มต้น</label>
                                            <input 
                                                type="text" 
                                                value={custDate} 
                                                onChange={e => setCustDate(e.target.value)} 
                                                placeholder="DD/MM/YYYY" 
                                                className="w-full border rounded-xl px-3.5 py-2.5 text-xs outline-none focus:border-[var(--flixie-accent)]" 
                                                style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }} 
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] mb-1.5 text-gray-400">เวลาเริ่มต้น</label>
                                            <input 
                                                type="text" 
                                                value={custTime} 
                                                onChange={e => setCustTime(e.target.value)} 
                                                placeholder="HH:MM" 
                                                className="w-full border rounded-xl px-3.5 py-2.5 text-xs outline-none focus:border-[var(--flixie-accent)]" 
                                                style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }} 
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[11px] mb-1.5 text-gray-400">อุปกรณ์</label>
                                        <select 
                                            value={custDevice} 
                                            onChange={e => setCustDevice(e.target.value)} 
                                            className="w-full border rounded-xl px-3.5 py-2.5 text-xs outline-none focus:border-[var(--flixie-accent)]" 
                                                style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }}
                                        >
                                            <option value="มือถือ">มือถือ</option>
                                            <option value="ไอแพด">ไอแพด</option>
                                            <option value="คอมพิวเตอร์">คอมพิวเตอร์</option>
                                            <option value="Smart TV">Smart TV</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-[11px] mb-1.5 text-gray-400">ระยะเวลา</label>
                                        <select 
                                            value={custDuration} 
                                            onChange={e => setCustDuration(e.target.value)} 
                                            className="w-full border rounded-xl px-3.5 py-2.5 text-xs outline-none focus:border-[var(--flixie-accent)]" 
                                            style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }}
                                        >
                                            <option value="1 วัน">1 วัน</option>
                                            <option value="7 วัน">7 วัน</option>
                                            <option value="14 วัน">14 วัน</option>
                                            <option value="30 วัน">30 วัน</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-[11px] mb-1.5 text-gray-400">ราคา (บาท) — เว้นว่างเพื่อใช้ราคาอัตโนมัติ</label>
                                        <input 
                                            type="number" 
                                            value={custCustomPrice} 
                                            onChange={e => setCustCustomPrice(e.target.value)} 
                                            placeholder={`ราคาอัตโนมัติ ฿${getAutoPrice()}`} 
                                            className="w-full border rounded-xl px-3.5 py-2.5 text-xs outline-none focus:border-[var(--flixie-accent)]" 
                                            style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }} 
                                        />
                                    </div>

                                    <div className="p-3 border rounded-xl flex justify-between items-center" style={{ backgroundColor: isLight ? '#f8fafc' : '#141414', borderColor: borderCol }}>
                                        <span className="text-[11px] text-gray-400">วันหมดอายุอัตโนมัติ:</span>
                                        <span className="text-xs font-bold text-amber-400">{calculateExpiry()}</span>
                                    </div>

                                    <div className="p-4 border rounded-2xl flex justify-between items-center bg-[#141414]" style={{ borderColor: borderCol }}>
                                        <span className="font-bold text-xs text-white">ราคาที่คิด</span>
                                        <span className="text-lg font-bold text-emerald-400">฿{finalPrice}</span>
                                    </div>

                                    <div className="flex justify-end gap-2 pt-2">
                                        <button type="button" onClick={() => setIsAddCustomerOpen(false)} className="border px-4 py-2.5 rounded-xl text-xs font-semibold" style={{ borderColor: borderCol, color: textMain }}>ยกเลิก</button>
                                        <button type="submit" className="bg-[var(--flixie-accent)] hover:bg-[color-mix(in_srgb,var(--flixie-accent),black_20%)] text-white px-6 py-2.5 rounded-xl text-xs font-semibold shadow">บันทึกรายการ</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
